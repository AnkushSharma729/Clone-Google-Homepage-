<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Google Dark Clone</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Font Awesome Icons -->
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- HEADER -->
<header>
  <div class="header-left">
    <a href="#">About</a>
    <a href="#">Store</a>
  </div>

  <div class="header-right">
    <a href="#">Gmail</a>
    <a href="#">Images</a>
    <i class="fas fa-th"></i>
    <button class="signin">Sign in</button>
  </div>
</header>

<!-- MAIN -->
<main>

  <!-- LOGO -->
  <h1 class="logo">Google</h1>

  <!-- SEARCH BAR -->
  <div class="search-bar">
    <i class="fas fa-plus"></i>

    <!-- ✅ FIXED INPUT (NO ERROR NOW) -->
    <input type="text" placeholder="Search Google or type a URL">

    <div class="search-icons">
      <i class="fas fa-microphone"></i>
      <i class="fas fa-camera"></i>
      <span class="ai-mode">
        <i class="fas fa-magic"></i> AI Mode
      </span>
    </div>
  </div>

  <!-- BUTTONS -->
  <div class="buttons">
    <button>Google Search</button>
    <button>I’m Feeling Lucky</button>
  </div>

  <!-- LANGUAGES -->
  <p class="languages">
    Google offered in:
    <a href="#">हिन्दी</a>
    <a href="#">বাংলা</a>
    <a href="#">తెలుగు</a>
    <a href="#">मराठी</a>
    <a href="#">தமிழ்</a>
    <a href="#">ગુજરાતી</a>
    <a href="#">ಕನ್ನಡ</a>
    <a href="#">മലയാളം</a>
    <a href="#">ਪੰਜਾਬੀ</a>
  </p>

</main>

<!-- FOOTER -->
<footer>
  <div class="footer-top">India</div>

  <div class="footer-bottom">
    <div>
      <a href="#">Advertising</a>
      <a href="#">Business</a>
      <a href="#">How Search works</a>
    </div>
    <div>
      <a href="#">Privacy</a>
      <a href="#">Terms</a>
      <a href="#">Settings</a>
    </div>
  </div>
</footer>

</body>
</html>
